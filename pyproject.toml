[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "track-embedding"
version = "1.0.0"
description = "Reference implementation of the shared track embedding (track-embedding/1)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "samplerate>=0.2.1",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["track_embedding"]

[tool.hatch.build.targets.sdist]
include = ["track_embedding", "tests", "fixtures", "scripts", "SPECIFICATION.md", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
